<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#526d38">
  <title>The Money Meadow</title>
  <link rel="preload" href="./garden-v4.png" as="image" fetchpriority="high">
  <link rel="preload" href="./traveler-sprite-v3.png" as="image">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d8e1cb;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #10180e; }
    }

    .scene {
      position: relative;
      width: min(100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      container-type: size;
      background: #526d38;
    }

    .plate,
    .air,
    .money-piece {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .plate {
      z-index: 0;
      display: block;
      object-fit: cover;
    }

    .air,
    .money-piece {
      pointer-events: none;
      background: url("./garden-v4.png") center / 100% 100% no-repeat;
      will-change: transform;
    }

    .air { z-index: 2; }

    .air-left {
      clip-path: polygon(0 0, 18% 0, 17% 67%, 0 77%);
      transform-origin: 9% 59%;
      animation: left-bloom 6.2s cubic-bezier(.45, 0, .55, 1) infinite alternate;
    }

    .air-summit {
      clip-path: polygon(56% 0, 100% 0, 100% 38%, 73% 34%);
      transform-origin: 82% 34%;
      animation: summit-bloom 7.4s cubic-bezier(.45, 0, .55, 1) -2.4s infinite alternate;
    }

    .air-right {
      clip-path: polygon(76% 35%, 100% 27%, 100% 100%, 79% 100%);
      transform-origin: 92% 90%;
      animation: right-bloom 6.7s cubic-bezier(.45, 0, .55, 1) -4.1s infinite alternate;
    }

    .air-center {
      clip-path: polygon(37% 19%, 67% 11%, 75% 51%, 42% 55%);
      transform-origin: 60% 50%;
      animation: center-bloom 5.3s cubic-bezier(.45, 0, .55, 1) -1.7s infinite alternate;
    }

    .coin {
      z-index: 3;
      clip-path: circle(6.2% at 43% 63%);
      transform-origin: 43% 63%;
      animation: coin-response 12s cubic-bezier(.2, .7, .3, 1) infinite;
    }

    .bill {
      z-index: 4;
      clip-path: polygon(49% 39%, 77% 34%, 79% 59%, 50% 61%);
      transform-origin: 51% 59%;
      animation: bill-response 12s cubic-bezier(.3, .7, .35, 1) infinite;
    }

    .traveler {
      position: absolute;
      z-index: 6;
      left: 0;
      top: 0;
      width: clamp(108px, 13.5cqw, 226px);
      aspect-ratio: 1;
      transform: translate3d(46cqw, 38cqh, 0);
      transform-origin: 50% 86%;
      filter:
        drop-shadow(0 1px 0 rgb(255 255 246 / .94))
        drop-shadow(0 .52cqw .32cqw rgb(32 27 17 / .32));
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    .pose-layer {
      position: absolute;
      inset: 0;
      background: url("./traveler-sprite-v3.png") 0 0 / 400% 300% no-repeat;
      opacity: 0;
      transition: opacity 90ms cubic-bezier(.2, .7, .3, 1);
      will-change: opacity, background-position;
    }

    .pose-layer:first-child { opacity: 1; }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      box-shadow: inset 0 0 7cqw rgb(28 35 18 / .12);
      background: linear-gradient(0deg, rgb(25 31 14 / .07), transparent 24%);
    }

    @keyframes coin-response {
      0%, 27%, 43%, 100% { transform: rotate(0deg); }
      31% { transform: rotate(-.7deg) translate3d(-.08cqw, .04cqh, 0); }
      35% { transform: rotate(1.1deg) translate3d(.1cqw, -.05cqh, 0); }
      39% { transform: rotate(-.35deg); }
    }

    @keyframes bill-response {
      0%, 49%, 68%, 100% { transform: perspective(40cqw) rotateX(0deg) rotateZ(0deg); }
      54% { transform: perspective(40cqw) rotateX(3deg) rotateZ(-.3deg) translate3d(-.08cqw, -.14cqh, 0); }
      59% { transform: perspective(40cqw) rotateX(7deg) rotateZ(.65deg) translate3d(.1cqw, -.38cqh, 0); }
      64% { transform: perspective(40cqw) rotateX(2deg) rotateZ(-.2deg); }
    }

    @keyframes left-bloom {
      from { transform: rotate(-.14deg) translate3d(-.04cqw, 0, 0); }
      to { transform: rotate(.27deg) translate3d(.08cqw, -.04cqh, 0); }
    }

    @keyframes summit-bloom {
      from { transform: rotate(-.1deg); }
      to { transform: rotate(.2deg) translate3d(.06cqw, -.03cqh, 0); }
    }

    @keyframes right-bloom {
      from { transform: rotate(.1deg); }
      to { transform: rotate(-.22deg) translate3d(-.06cqw, -.03cqh, 0); }
    }

    @keyframes center-bloom {
      from { transform: rotate(-.11deg); }
      to { transform: rotate(.24deg) translate3d(.05cqw, -.04cqh, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .air,
      .money-piece { animation: none; }

      .pose-layer { transition: none; }
    }
  </style>
</head>
<body>
  <main class="scene" role="img" aria-label="An illustrated woman curiously climbs a hill of realistic coins and paper currency in a dense flowering garden.">
    <img class="plate" src="./garden-v4.png" alt="" width="1672" height="941" fetchpriority="high">
    <div class="air air-left" aria-hidden="true"></div>
    <div class="air air-center" aria-hidden="true"></div>
    <div class="air air-summit" aria-hidden="true"></div>
    <div class="air air-right" aria-hidden="true"></div>
    <div class="money-piece coin" aria-hidden="true"></div>
    <div class="money-piece bill" aria-hidden="true"></div>
    <div class="traveler" aria-hidden="true">
      <div class="pose-layer"></div>
      <div class="pose-layer"></div>
    </div>
  </main>

  <script>
    (() => {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const traveler = document.querySelector(".traveler");
      const layers = [...document.querySelectorAll(".pose-layer")];
      const positions = [
        "0 0", "33.333% 0", "66.667% 0", "100% 0",
        "0 50%", "33.333% 50%", "66.667% 50%", "100% 50%",
        "0 100%", "33.333% 100%", "66.667% 100%", "100% 100%"
      ];
      const duration = 12;
      const vignettes = [
        { start: .25, end: 2.45, x: 17, y: 55, s: .98, frames: [0, 1, 2, 2, 1], tilt: -2 },
        { start: 2.85, end: 5.25, x: 32, y: 49, s: 1.02, frames: [2, 3, 3, 4, 5], tilt: -4 },
        { start: 5.65, end: 8.15, x: 46, y: 36, s: 1.02, frames: [6, 7, 8, 8, 9], tilt: -3 },
        { start: 8.55, end: 11.25, x: 62, y: 22, s: 1.04, frames: [9, 10, 10, 11, 10], tilt: -1 }
      ];

      let active = 0;
      let currentFrame = -1;
      let start = performance.now();

      const setFrame = (frame, immediate = false) => {
        if (frame === currentFrame) return;
        const next = 1 - active;
        layers[next].style.backgroundPosition = positions[frame];
        if (immediate) layers[next].style.transition = "none";
        layers[next].style.opacity = "1";
        layers[active].style.opacity = "0";
        if (immediate) requestAnimationFrame(() => layers[next].style.removeProperty("transition"));
        active = next;
        currentFrame = frame;
      };

      const renderStill = () => {
        traveler.style.transform = "translate3d(62cqw, 22cqh, 0) rotate(-1deg) scale(1.04)";
        traveler.style.opacity = "1";
        traveler.style.filter = "drop-shadow(0 1px 0 rgb(255 255 246 / .94)) drop-shadow(0 .52cqw .32cqw rgb(32 27 17 / .32))";
        setFrame(10, true);
      };

      const tick = now => {
        if (reduced.matches) {
          renderStill();
          return;
        }

        const elapsed = ((now - start) / 1000) % duration;
        const vignette = vignettes.find(item => elapsed >= item.start && elapsed < item.end);
        if (!vignette) {
          traveler.style.opacity = "0";
          traveler.style.filter = "blur(.18cqw) drop-shadow(0 .52cqw .32cqw rgb(32 27 17 / .18))";
          requestAnimationFrame(tick);
          return;
        }

        const local = elapsed - vignette.start;
        const span = vignette.end - vignette.start;
        const progress = local / span;
        const edge = Math.min(1, local / .16, (vignette.end - elapsed) / .18);
        const frameIndex = Math.min(vignette.frames.length - 1, Math.floor(progress * vignette.frames.length));
        const settle = Math.sin(progress * Math.PI);
        const bob = Math.sin(progress * Math.PI * 4) * .11 * settle;
        const sway = Math.sin(progress * Math.PI * 3) * .75 * settle;
        const breathe = 1 + Math.sin(progress * Math.PI * 2) * .008;

        traveler.style.transform = `translate3d(${vignette.x}cqw, ${vignette.y + bob}cqh, 0) rotate(${vignette.tilt + sway}deg) scale(${vignette.s * breathe})`;
        traveler.style.opacity = String(Math.max(0, edge));
        traveler.style.filter = `blur(${(1 - edge) * .18}cqw) drop-shadow(0 1px 0 rgb(255 255 246 / .94)) drop-shadow(0 .52cqw .32cqw rgb(32 27 17 / .32))`;
        setFrame(vignette.frames[frameIndex]);
        requestAnimationFrame(tick);
      };

      renderStill();
      if (!reduced.matches) {
        start = performance.now();
        requestAnimationFrame(tick);
      }
      reduced.addEventListener("change", () => location.reload(), { once: true });
    })();
  </script>
</body>
</html>

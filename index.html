<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#526d38">
  <title>The Money Meadow</title>
  <link rel="preload" href="./garden-v2.png" as="image" fetchpriority="high">
  <link rel="preload" href="./traveler-sprite-v2.png" as="image">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d8e1cb;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #10180e; }
    }

    .scene {
      position: relative;
      width: min(100vw, 177.78dvh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      container-type: size;
      background: #526d38;
    }

    .plate,
    .air,
    .money-piece {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .plate {
      z-index: 0;
      display: block;
      object-fit: cover;
    }

    .air,
    .money-piece {
      pointer-events: none;
      background: url("./garden-v2.png") center / 100% 100% no-repeat;
      will-change: transform;
    }

    .air { z-index: 2; }

    .air-left {
      clip-path: polygon(0 0, 16% 0, 13% 48%, 0 58%);
      transform-origin: 8% 48%;
      animation: left-bloom 5.8s cubic-bezier(.45, 0, .55, 1) infinite alternate;
    }

    .air-summit {
      clip-path: polygon(62% 0, 100% 0, 100% 34%, 75% 30%);
      transform-origin: 82% 31%;
      animation: summit-bloom 7.1s cubic-bezier(.45, 0, .55, 1) -2.4s infinite alternate;
    }

    .air-right {
      clip-path: polygon(78% 45%, 100% 38%, 100% 100%, 84% 100%);
      transform-origin: 91% 88%;
      animation: right-bloom 6.4s cubic-bezier(.45, 0, .55, 1) -4.1s infinite alternate;
    }

    .air-center {
      clip-path: polygon(53% 20%, 70% 13%, 72% 40%, 55% 44%);
      transform-origin: 62% 42%;
      animation: center-bloom 4.9s cubic-bezier(.45, 0, .55, 1) -1.7s infinite alternate;
    }

    .coin {
      z-index: 3;
      clip-path: circle(7.4% at 42.2% 55.4%);
      transform-origin: 42.2% 55.4%;
      animation: coin-response 14s cubic-bezier(.2, .7, .3, 1) infinite;
    }

    .bill {
      z-index: 4;
      clip-path: polygon(46% 37%, 67% 32%, 70% 58%, 48% 60%);
      transform-origin: 48% 58%;
      animation: bill-response 14s cubic-bezier(.3, .7, .35, 1) infinite;
    }

    .traveler {
      position: absolute;
      z-index: 6;
      left: 0;
      top: 0;
      width: clamp(108px, 13.5cqw, 226px);
      aspect-ratio: 1;
      background-image: url("./traveler-sprite-v2.png");
      background-repeat: no-repeat;
      background-size: 400% 300%;
      background-position: 0 0;
      filter:
        drop-shadow(0 1px 0 rgb(255 255 246 / .92))
        drop-shadow(0 .55cqw .34cqw rgb(32 27 17 / .34));
      will-change: transform, opacity, background-position;
      animation:
        journey 14s linear infinite,
        performance 14s steps(1, end) infinite;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      box-shadow: inset 0 0 7cqw rgb(28 35 18 / .13);
      background: linear-gradient(0deg, rgb(25 31 14 / .08), transparent 24%);
    }

    @keyframes journey {
      0%   { transform: translate3d(1cqw, 70cqh, 0) rotate(-3deg) scale(.9); opacity: 0; }
      4%   { transform: translate3d(5cqw, 68cqh, 0) rotate(-4deg) scale(.92); opacity: 1; }
      11%  { transform: translate3d(12cqw, 65cqh, 0) rotate(-6deg) scale(.95); }
      19%  { transform: translate3d(20cqw, 61cqh, 0) rotate(-8deg) scale(.98); }
      27%  { transform: translate3d(28cqw, 56cqh, 0) rotate(-9deg) scale(1); }
      31%  { transform: translate3d(33cqw, 51cqh, 0) rotate(-3deg) scale(1.01); }
      38%  { transform: translate3d(34cqw, 50cqh, 0) rotate(2deg) scale(1.01); }
      41%  { transform: translate3d(32cqw, 52cqh, 0) rotate(-7deg) scale(1.02); }
      47%  { transform: translate3d(26cqw, 58cqh, 0) rotate(-16deg) scale(.98); }
      52%  { transform: translate3d(29cqw, 55cqh, 0) rotate(-7deg) scale(.99); }
      59%  { transform: translate3d(39cqw, 47cqh, 0) rotate(-9deg) scale(1); }
      63%  { transform: translate3d(45cqw, 39cqh, 0) rotate(-5deg) scale(1.01); }
      69%  { transform: translate3d(46cqw, 38cqh, 0) rotate(1deg) scale(1.01); }
      77%  { transform: translate3d(57cqw, 31cqh, 0) rotate(-8deg) scale(1.02); }
      84%  { transform: translate3d(65cqw, 24cqh, 0) rotate(-4deg) scale(1.03); }
      90%  { transform: translate3d(70cqw, 20cqh, 0) rotate(1deg) scale(1.03); }
      97%  { transform: translate3d(81cqw, 11cqh, 0) rotate(-3deg) scale(1.04); opacity: 1; }
      100% { transform: translate3d(87cqw, 7cqh, 0) rotate(-1deg) scale(1.04); opacity: 0; }
    }

    @keyframes performance {
      0%, 8.9% { background-position: 0 0; }
      9%, 16.9% { background-position: 33.333% 0; }
      17%, 23.9% { background-position: 0 0; }
      24%, 29.9% { background-position: 33.333% 0; }
      30%, 34.9% { background-position: 66.667% 0; }
      35%, 39.9% { background-position: 100% 0; }
      40%, 43.9% { background-position: 0 50%; }
      44%, 48.9% { background-position: 33.333% 50%; }
      49%, 53.9% { background-position: 66.667% 50%; }
      54%, 59.9% { background-position: 100% 50%; }
      60%, 68.9% { background-position: 0 100%; }
      69%, 77.9% { background-position: 33.333% 100%; }
      78%, 85.9% { background-position: 66.667% 100%; }
      86%, 100% { background-position: 100% 100%; }
    }

    @keyframes coin-response {
      0%, 34%, 46%, 100% { transform: rotate(0deg); }
      37% { transform: rotate(-1.4deg) translate3d(-.15cqw, .08cqh, 0); }
      40% { transform: rotate(1.8deg) translate3d(.2cqw, -.1cqh, 0); }
      43% { transform: rotate(-.8deg); }
    }

    @keyframes bill-response {
      0%, 58%, 72%, 100% { transform: perspective(40cqw) rotateX(0deg) rotateZ(0deg); }
      63% { transform: perspective(40cqw) rotateX(4deg) rotateZ(-.5deg) translate3d(-.12cqw, -.25cqh, 0); }
      67% { transform: perspective(40cqw) rotateX(8deg) rotateZ(1deg) translate3d(.18cqw, -.5cqh, 0); }
      70% { transform: perspective(40cqw) rotateX(2deg) rotateZ(-.4deg); }
    }

    @keyframes left-bloom {
      from { transform: rotate(-.18deg) translate3d(-.05cqw, 0, 0); }
      to { transform: rotate(.34deg) translate3d(.11cqw, -.06cqh, 0); }
    }

    @keyframes summit-bloom {
      from { transform: rotate(-.12deg); }
      to { transform: rotate(.24deg) translate3d(.08cqw, -.04cqh, 0); }
    }

    @keyframes right-bloom {
      from { transform: rotate(.12deg); }
      to { transform: rotate(-.28deg) translate3d(-.08cqw, -.04cqh, 0); }
    }

    @keyframes center-bloom {
      from { transform: rotate(-.14deg); }
      to { transform: rotate(.3deg) translate3d(.06cqw, -.06cqh, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .air,
      .money-piece,
      .traveler { animation: none; }

      .traveler {
        transform: translate3d(46cqw, 38cqh, 0);
        background-position: 66.667% 100%;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="scene" role="img" aria-label="An illustrated woman curiously climbs a hill of coins and paper money in a dense flowering garden.">
    <img class="plate" src="./garden-v2.png" alt="" width="1672" height="941" fetchpriority="high">
    <div class="air air-left" aria-hidden="true"></div>
    <div class="air air-center" aria-hidden="true"></div>
    <div class="air air-summit" aria-hidden="true"></div>
    <div class="air air-right" aria-hidden="true"></div>
    <div class="money-piece coin" aria-hidden="true"></div>
    <div class="money-piece bill" aria-hidden="true"></div>
    <div class="traveler" aria-hidden="true"></div>
  </main>
</body>
</html>
